  favicon_shortcut_icon = "images/favicon.png"
  custom_stylesheets = [ "scss/_variables.scss" ]
  dateFormat = "26 FEB 1994"
  author = "Alicja Tranda"
  googleAnalitycsID = "Your ID"
  formKey = "7ff10cdf-9c8e-413b-914c-9b576b145c67"

  [params.banner]
    hero_image = "images/hero.jpg"

  [params.video]
    enable = true

    [[params.video.link]]
      url = "https://www.youtube.com/embed/T27XggtdVaQ"
    [[params.video.link]]
      url = "https://www.youtube.com/embed/uinGXAnFpvw"
    [[params.video.link]]
      url = "https://www.youtube.com/embed/T27XggtdVaQ"

  [params.bio]
    bio_image = "images/bio.jpg"

  [params.lessons]
    lessons_image = "images/lessons.jpg"

  [params.footer]
    copyright = "Alicja Tranda "

    [params.footer.contact]
      email = "mail@alicjatranda.com"

      [[params.footer.contact.link]]
        name = "Facebook"
