baseURL       = "https://atrandah.github.io/site"
title         = "Alicja Tranda"
summarylength = 25

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  logo = "images/logo.png"
  logo_footer = "images/logo.png"
  favicon_icon = "images/favicon.ico"
  images = [ "images/bio.jpg" ]
  favicon_shortcut_icon = "images/favicon.png"
  custom_stylesheets = [ "scss/_variables.scss" ]
  dateFormat = "26 FEB 1994"
  author = "Alicja Tranda"
  googleAnalitycsID = "Your ID"
  fabform  = "https://fabform.io/f/xM-wwPg"

  [params.banner]
    hero_image = "images/hero.jpg"

  [params.video]
    enable = true

    [[params.video.link]]
      url = "https://www.youtube.com/embed/T27XggtdVaQ"
    [[params.video.link]]
      url = "https://www.youtube.com/embed/uinGXAnFpvw"
    [[params.video.link]]
      url = "https://www.youtube.com/embed/T27XggtdVaQ"

  [params.bio]
    bio_image = "images/bio.jpg"

  [params.lessons]
    lessons_image = "images/lessons.jpg"

  [params.call_to_action]
    enable           = true
    background_image = "images/backgrounds/cta-background.jpg"

  [params.footer]
    copyright = "Alicja Tranda "

    [params.footer.contact]
      email = "mail@alicjatranda.com"

      [[params.footer.contact.link]]
        name = "Facebook"
        url  = "https://www.facebook.com/AlicjaTrandaVocalCoach"
      [[params.footer.contact.link]]
        name = "Instagram"
        url  = "https://www.instagram.com/alicjatranda.vocalcoach/"
      [[params.footer.contact.link]]
        name = "YouTube"
        url  = "https://www.youtube.com/@alicjatrandamusic"

[languages]
  [languages.en]
    contentDir = 'content/english'
    locale = 'EN'
    label = 'English'
    weight = 1

    [languages.en.params]
      description = "Alicja Tranda - vocal coach and vocalist based in Lodz, Poland (EU)"

      [languages.en.params.contactForm]
        placeholder_first_name = "First Name"
        placeholder_last_name  = "Last Name"
        placeholder_email      = "Email"
        placeholder_phone      = "Phone"
        placeholder_message    = "Message"
        send_message           = "Send"

      [languages.en.params.navAction]
        status = true
        name   = "Get in touch"
        url    = "contact"

      [languages.en.params.banner]
        enable             = true
        heading            = "Alicja Tranda"
        description        = "Vocal coach and vocalist based in Lodz, Poland (EU)."
        primary_button     = "Contact"
        primary_button_url = "contact"

      [languages.en.params.statement]
        enable  = true
        heading = "Free your voice with me"
        content = """
          Do you feel your voice cannot reach its full potential? Do you
          dream of a free, capable voice with vast range - ready for stage and
          studio demands? Let me guide you in this process of building a strong
          foundation for your artistic development. I work with singers who want
          to unlock the best in their voices. I believe everyone can sing - you
          need a tailored practice to blossom truly.
          """

      [languages.en.params.bio]
        enable             = true
        heading            = "About me"
        primary_button     = "Full bio"
        primary_button_url = "about"
        content            = """
          Alicja is a vocalist and vocal coach specialising in contemporary and
          rock vocal performance. She is a Level 3 (advanced) Modern Vocal Training coach
          with several years of experience, working with singers at all levels,
          individually and in groups. Alicja is constantly improving her skills
          under the supervision of specialists from around the world, studying
          diverse approaches to voice. Her additional professional training
          includes courses in music production, songwriting, acting and Estill level 1 & 2.
          As a vocalist, dancer and actress, she has performed in theatre productions,
          concerts, and experimental art projects. Currently, Alicja is
          co-founding Ekstremalna Szkoła Wokalna (Extreme Vocal School) in Lodz
          and continues to develop her own artistic work.
          """

      [languages.en.params.lessons]
        enable             = true
        heading            = "Vocal coaching for singers / online lessons"
        primary_button     = "Sign me in"
        primary_button_url = "lessons"
        content            = """
          No matter how experienced you are, together we will find solutions to
          improve your voice. During private lessons, we work toward your goals - every lesson is
          created for your growth. Your vocal abilities expand through scales, song
          fragments, and many other exercises. You will learn how to work on your voice
          between our sessions, becoming more aware of your vocal health, growing your
          stamina, and overcoming stage fright! My role as a vocal coach is to create an
          environment where you can develop your unique sound and explore new
          possibilities.
          """

      [languages.en.params.call_to_action]
        enable               = true
        title                = "LET’S WORK TOGETHER"
        primary_button       = "Submit Query"
        primary_button_url   = "contact"
        secondary_button     = "Not Convinced"
        secondary_button_url = "portfolio"

      [languages.en.params.footer]

        [languages.en.params.footer.contact]
          title = "Contact"

        [languages.en.params.footer.other]
          title       = "ESW"
          description = "Do you need a stationary in-person lesson? You will find me here!"
          url         = "ekstremalnaszkolawokalna.pl"
          address     = "Piwna 24, Łódź, Poland"

        [languages.en.params.footer.service]
          title       = "Online lessons"
          description = "I also offer online lessons (PL / ENG). Learn from anywhere! Let's find a convenient date - DM me or send me an email."

        [languages.en.params.footer.back_to_top]
          description = "I want to <br> visit again"

  [languages.pl]
    contentDir = 'content/polish'
    locale = 'PL'
    label = 'Polish'
    weight = 2

    [languages.pl.params]
      description = "Alicja Tranda - nauczycielka śpiewu i wokalistka z Łodzi (Polska, UE)"

      [languages.pl.params.contactForm]
        placeholder_first_name = "First Name"
        placeholder_last_name  = "Last Name"
        placeholder_email      = "Email"
        placeholder_phone      = "Phone"
        placeholder_message    = "Message"
        send_message           = "Send"

      [languages.pl.params.navAction]
        status = true
        name   = "Get in touch"
        url    = "contact"

      [languages.pl.params.banner]
        enable             = true
        heading            = "Alicja Tranda"
        description        = "Nauczycielka śpiewu i wokalistka z Łodzi (Polska, UE)."
        primary_button     = "Kontakt"
        primary_button_url = "contact"

      [languages.pl.params.statement]
        enable  = true
        heading = "Uwolnij swój głos ze mną"
        content = """
          Czujesz, że nie wykorzystujesz w pełni potencjału swojego głosu?
          Marzysz o szerokiej skali i dźwięcznej barwie? Planujesz przygotować
          się na wyzwania sceny, castingu lub studia nagraniowego? Pozwól, że
          poprowadzę Cię w procesie budowania solidnych podstaw Twojego
          artystycznego rozwoju. Pracuję z wokalistami, którzy chcą wydobyć ze
          swojego głosu to, co najlepsze. Wierzę, że każdy może śpiewać -
          potrzebujesz treningu dopasowanego do swoich potrzeb, by w pełni
          rozkwitnąć.
          """

      [languages.pl.params.bio]
        enable             = true
        heading            = "O mnie"
        primary_button     = "Pełne bio"
        primary_button_url = "about"
        content            = """
        Alicja jest wokalistką i trenerką wokalną specjalizującą się w śpiewie rozrywkowym i rockowym.
        Jest trenerką Modern Vocal Training na poziomie 3 (zaawansowanym) z wieloletnim doświadczeniem,
        pracującą z wokalistami na każdym poziomie zaawansowania, zarówno indywidualnie, jak i w grupach.
        Alicja nieustannie doskonali swoje umiejętności pod okiem specjalistów z całego świata.
        Poszerza swoje horyzonty poznając różne metody pracy z głosem i ciałem:
        na warsztatach, kursach i konferencjach naukowych.
        Jej dodatkowe szkolenia obejmują m.in. kursy produkcji muzycznej, pisania piosenek,
        aktorskie i Estill poziom 1 i 2.
        Jako wokalistka, tancerka i aktorka występowała w spektaklach teatralnych,
        koncertach i eksperymentalnych projektach artystycznych.
        Obecnie Alicja współtworzy Ekstremalną Szkołę Wokalną Ady Rusinkiewicz w Łodzi
        i rozwija własną twórczość artystyczną.
          """

      [languages.pl.params.lessons]
        enable             = true
        heading            = "Lekcje śpiewu dla wokalistów / trening online"
        primary_button     = "Zapisz mnie"
        primary_button_url = "lessons"
        content            = """
          Niezależnie od Twojego doświadczenia znajdziemy rozwiązania,
          które sprawią, że Twój śpiew wzniesie się na wyższy poziom.
          Podczas zajęć indywidualnych określamy cele i pracujemy nad nimi - każda lekcja
          tworzona jest z myślą o Twoim rozwoju. Twoje możliwości wokalne
          poszerzą się dzięki indywidualnie dobranym skalom i fragmentom piosenek.
          Nauczysz się, jak pracować nad głosem między naszymi spotkaniami,
          dowiesz się, jak zadbać o swoje zdrowie wokalne, zbudujesz większą
          wytrzymałość i zdobędziesz narzędzia, dzięki którym pokonasz tremę!
          Moją rolą, jako trenerki wokalnej, jest stworzenie warunków,
          w których możesz rozwijać swoje unikalne brzmienie i odkrywać nowe możliwości.
          """

      [languages.pl.params.call_to_action]
        enable               = true
        heading              = "LET’S WORK TOGETHER"
        primary_button       = "Submit Query"
        primary_button_url   = "contact"
        secondary_button     = "Not Convinced"
        secondary_button_url = "portfolio"

      [languages.pl.params.footer]

        [languages.pl.params.footer.contact]
          title = "Kontakt"

        [languages.pl.params.footer.other]
          title       = "ESW"
          description = "Potrzebujesz stacjonarnej lekcji na żywo? Znajdziesz mnie tutaj!"
          url         = "ekstremalnaszkolawokalna.pl"
          address     = "Piwna 24, Łódź, Poland"

        [languages.pl.params.footer.service]
          title       = "Lekcje online"
          description = "Oferuję również lekcje online (PL / ANG). Ucz się z dowolnego miejsca! Znajdźmy wspólny termin - wyślij e-mail lub wiadomość prywatną."

        [languages.pl.params.footer.back_to_top]
          description = "Wróć na górę"
